name: Tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      # Vitest doesn't type-check, and the app is otherwise only compiled
      # during the Fly deploy, after merging.
      - name: Type-check
        run: npm run typecheck
      - name: Run tests
        run: npm test
